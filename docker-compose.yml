services:
  showcase-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: excloudvault-showcase-portal:latest
    container_name: excloudvault-showcase-portal
    restart: unless-stopped
    ports:
      - "30020:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
